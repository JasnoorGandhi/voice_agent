<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Voice Support Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d12;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .app {
      width: 100%;
      max-width: 660px;
      height: 92vh;
      max-height: 780px;
      background: #13131a;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.07);
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .avatar {
      width: 38px; height: 38px; border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      box-shadow: 0 4px 12px rgba(99,102,241,0.35);
    }
    .header-title { font-weight: 600; font-size: 15px; color: #f1f5f9; }
    .header-sub { font-size: 12px; color: rgba(255,255,255,0.35); margin-top: 2px; }

    .interrupt-badge {
      font-size: 12px; padding: 4px 10px; border-radius: 20px;
      background: rgba(34,197,94,0.12); color: #4ade80;
      border: 1px solid rgba(34,197,94,0.2);
      display: none;
    }
    .interrupt-badge.visible { display: block; }

    /* ── Messages ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 3px; }
    .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

    .msg {
      display: flex;
      animation: fadeUp 0.2s ease;
    }
    .msg.user { justify-content: flex-end; }
    .msg.agent { justify-content: flex-start; }

    .bubble {
      max-width: 75%;
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.6;
      border-radius: 16px;
    }
    .msg.user .bubble {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .msg.agent .bubble {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.08);
      color: #e2e8f0;
      border-bottom-left-radius: 4px;
    }
    .msg-time {
      font-size: 11px;
      color: rgba(255,255,255,0.25);
      margin-top: 4px;
      text-align: right;
    }
    .msg.agent .msg-time { text-align: left; }

    /* Typing indicator */
    .typing { display: flex; gap: 5px; align-items: center; padding: 12px 14px; }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #6366f1;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    /* ── Status bar ── */
    .status-bar {
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid rgba(255,255,255,0.04);
      flex-shrink: 0;
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .status-label { font-size: 12px; color: rgba(255,255,255,0.35); }

    /* ── Controls ── */
    .controls {
      padding: 16px 20px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .hint {
      font-size: 12px;
      color: rgba(255,255,255,0.3);
      text-align: center;
      line-height: 1.5;
    }

    .mic-btn {
      width: 72px; height: 72px;
      border-radius: 50%; border: none;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      box-shadow: 0 8px 24px rgba(99,102,241,0.35);
      transition: all 0.2s;
      position: relative;
    }
    .mic-btn:hover { transform: scale(1.05); }
    .mic-btn.recording {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 0 0 10px rgba(239,68,68,0.12), 0 8px 24px rgba(239,68,68,0.35);
      animation: pulse 1.5s ease-in-out infinite;
    }
    .mic-btn.disabled {
      opacity: 0.5; cursor: not-allowed; transform: none;
    }

    /* Volume ring — shows when monitoring for interruption */
    .volume-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid rgba(239,68,68,0);
      transition: border-color 0.1s, transform 0.1s;
      pointer-events: none;
    }
    .volume-ring.active {
      border-color: rgba(239,68,68,0.6);
      transform: scale(1.15);
    }

    .footer-note {
      font-size: 11px;
      color: rgba(255,255,255,0.18);
      text-align: center;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%           { transform: translateY(-6px); }
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 10px rgba(239,68,68,0.12), 0 8px 24px rgba(239,68,68,0.35); }
      50%       { box-shadow: 0 0 0 16px rgba(239,68,68,0.06), 0 8px 24px rgba(239,68,68,0.35); }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="avatar">🎧</div>
      <div>
        <div class="header-title">Support Agent</div>
        <div class="header-sub" id="conn-status">Connecting...</div>
      </div>
    </div>
    <div class="interrupt-badge" id="interrupt-badge">⚡ <span id="interrupt-ms">—</span>ms interrupt</div>
  </div>

  <!-- Messages -->
  <div class="messages" id="messages">
    <div class="msg agent">
      <div>
        <div class="bubble">
          Hi! I'm your support agent. Ask me about orders, returns, shipping, or payments.
          Just speak while I'm talking to interrupt me — no need to tap the mic.
        </div>
        <div class="msg-time" id="init-time"></div>
      </div>
    </div>
  </div>

  <!-- Status bar -->
  <div class="status-bar">
    <div class="status-dot" id="status-dot" style="background:#4b5563"></div>
    <span class="status-label" id="status-label">Ready</span>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="hint" id="hint">Speak anytime to interrupt. Tap the mic when the agent is idle.</div>
    <button class="mic-btn" id="mic-btn" onclick="toggleMic()">
      🎤
      <div class="volume-ring" id="vol-ring"></div>
    </button>
    <div class="footer-note">0801IT231061 ~ Jasnoor Gandhi</div>
  </div>

</div>

<script>
// ── Config ──────────────────────────────────────────────────────────
const WS_URL = `ws://${location.host}/ws`;
const SILENCE_TIMEOUT_MS = 2500;       // hangover after last real speech
const PRE_SPEECH_TIMEOUT_MS = 7000;    // wait this long for the user to start talking
const MIN_RECORD_MS = 1200;            // never auto-stop before this
const SPEECH_RMS_THRESHOLD = 4;      // 0–100 RMS; enough to count as speech
const INTERRUPT_RMS_THRESHOLD = 5.5;   // speech while agent is talking
const CLICK_IGNORE_MS = 200;           // skip mouse/keyboard clicks; speech is longer

// ── State ────────────────────────────────────────────────────────────
let ws = null;
let mediaRecorder = null;
let chunks = [];
let audioCtx = null;
let analyser = null;
let micStream = null;
let monitorRaf = null;
let silenceTimer = null;
let interruptTimestamp = null;
let agentAudio = new Audio();
let agentSpeaking = false;
let isRecording = false;
let wsReady = false;
let bgStream = null;
let bgCtx = null;
let bgStartPromise = null;
let pausedForBargeIn = false;
let heardSpeech = false;
let recordStartedAt = 0;
let bargeInStartedAt = 0;

// ── DOM ──────────────────────────────────────────────────────────────
const msgContainer = document.getElementById('messages');
const micBtn = document.getElementById('mic-btn');
const statusDot = document.getElementById('status-dot');
const statusLabel = document.getElementById('status-label');
const hintEl = document.getElementById('hint');
const connStatus = document.getElementById('conn-status');
const interruptBadge = document.getElementById('interrupt-badge');
const interruptMs = document.getElementById('interrupt-ms');
const volRing = document.getElementById('vol-ring');
document.getElementById('init-time').textContent = now();

// ── WebSocket ────────────────────────────────────────────────────────
function connect() {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    wsReady = true;
    connStatus.textContent = 'Connected';
    setStatus('idle');
  };

  ws.onclose = () => {
    wsReady = false;
    connStatus.textContent = 'Reconnecting...';
    setStatus('disconnected');
    setTimeout(connect, 2000);
  };

  ws.onerror = () => {
    wsReady = false;
    connStatus.textContent = 'Connection error';
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);

    if (msg.type === 'transcript') {
      addMessage('user', msg.text);

    } else if (msg.type === 'response_text') {
      addMessage('agent', msg.text);
      removeTyping();

    } else if (msg.type === 'audio') {
      playAudio(msg.data);

    } else if (msg.type === 'status') {
      if (msg.text === 'transcribing') {
        setStatus('transcribing');
        showTyping();
      } else if (msg.text === 'thinking') {
        setStatus('thinking');
      } else if (msg.text === 'speaking') {
        setStatus('speaking');
      }

    } else if (msg.type === 'interrupted') {
      removeTyping();
      if (interruptTimestamp) {
        const latency = Math.round(performance.now() - interruptTimestamp);
        if(latency<1000){
          interruptMs.textContent = latency;
          interruptBadge.classList.add('visible');
          setTimeout(() => interruptBadge.classList.remove('visible'), 3000);
        }
        interruptTimestamp = null;
      }

    } else if (msg.type === 'ignored') {
      removeTyping();
      resumePausedAgent();

    } else if (msg.type === 'done') {
      pausedForBargeIn = false;
      setStatus('idle');

    } else if (msg.type === 'error') {
      removeTyping();
      if (pausedForBargeIn) {
        resumePausedAgent();
      } else {
        addMessage('agent', msg.text);
        setStatus('idle');
      }
    }
  };
}

// ── Audio playback ────────────────────────────────────────────────────
function playAudio(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  const blob = new Blob([bytes], { type: 'audio/mpeg' });
  const url = URL.createObjectURL(blob);

  agentAudio.pause();
  agentAudio = new Audio(url);
  agentAudio.onended = () => {
    agentSpeaking = false;
    setStatus('idle');
  };
  if (bgCtx && bgCtx.state === 'suspended') bgCtx.resume().catch(() => {});
  agentAudio.play().catch(() => {});
  agentSpeaking = true;
  pausedForBargeIn = false;
  setStatus('speaking');
}

function resumePausedAgent() {
  const canResume = agentAudio.src && !agentAudio.ended && agentAudio.currentTime > 0;
  if (pausedForBargeIn && canResume) {
    agentAudio.play().catch(() => {});
    agentSpeaking = true;
    pausedForBargeIn = false;
    setStatus('speaking');
    hintEl.textContent = 'Speak anytime to interrupt. Tap the mic when the agent is idle.';
    return;
  }
  pausedForBargeIn = false;
  setStatus('idle');
  hintEl.textContent = 'Speak anytime to interrupt. Tap the mic when the agent is idle.';
}

// ── Interruption ──────────────────────────────────────────────────────
function interrupt() {
  // 1. Stop playback immediately (client-side — instant)
  agentAudio.pause();
  agentAudio.src = '';
  agentSpeaking = false;

  // 2. Record timestamp for latency measurement
  interruptTimestamp = performance.now();

  // 3. Cancel server pipeline
  send({ type: 'interrupt' });
}

// ── Volume monitor ────────────────────────────────────────────────────
// Runs continuously while mic stream is open.
// Detects: (a) interruption while agent speaks, (b) silence to auto-stop recording
function startVolumeMonitor(stream) {
  audioCtx = new AudioContext();
  const source = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 512;
  source.connect(analyser);

  const data = new Uint8Array(analyser.frequencyBinCount);

  function tick() {
    analyser.getByteFrequencyData(data);
    const vol = data.reduce((a, b) => a + b, 0) / data.length;

    // ── Interruption detection ──
    if (isRecording && vol > SPEECH_RMS_THRESHOLD) {
      heardSpeech = true;
      resetSilenceTimer();
    }

    monitorRaf = requestAnimationFrame(tick);
  }
  monitorRaf = requestAnimationFrame(tick);
}

function stopVolumeMonitor() {
  cancelAnimationFrame(monitorRaf);
  monitorRaf = null;
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  analyser = null;
  volRing.classList.remove('active');
}

// ── Silence timer ─────────────────────────────────────────────────────
function resetSilenceTimer(ms = SILENCE_TIMEOUT_MS) {
  clearTimeout(silenceTimer);
  silenceTimer = setTimeout(() => {
    if (!isRecording) return;
    const elapsed = performance.now() - recordStartedAt;
    if (elapsed < MIN_RECORD_MS && heardSpeech) {
      resetSilenceTimer(MIN_RECORD_MS - elapsed + 200);
      return;
    }
    stopRecording();
  }, ms);
}

// ── Recording ─────────────────────────────────────────────────────────
function stopAgentNow({ hard = false } = {}) {
  const stopTime = performance.now();
  agentAudio.pause();
  agentSpeaking = false;
  if (hard) {
    agentAudio.src = '';
    pausedForBargeIn = false;
    send({ type: 'interrupt' });
  } else {
    pausedForBargeIn = true;
  }

  // Show latency immediately — audio.pause() is the real stop moment
  // No need to wait for server confirmation
  if (interruptTimestamp) {
    const latency = Math.round(stopTime - interruptTimestamp);
    if (latency > 0 && latency < 800) {
      interruptMs.textContent = latency;
      interruptBadge.classList.add('visible');
      setTimeout(() => interruptBadge.classList.remove('visible'), 3000);
    }
    interruptTimestamp = null;
  }
}

async function startRecording({ bargeIn = false } = {}) {
  if (isRecording) return;
  if (!wsReady) { alert('Not connected to server.'); return; }

  if ((agentSpeaking || pausedForBargeIn) && !bargeIn) {
    stopAgentNow({ hard: true });
  }

  await startBackgroundMonitor();

  try {
    const stream = bgStream || await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });

    chunks = [];
    heardSpeech = false;
    recordStartedAt = performance.now();
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      isRecording = false;
      updateMicBtn();
      clearTimeout(silenceTimer);
      await sendAudio();
    };

    mediaRecorder.start(100);
    isRecording = true;
    updateMicBtn();
    setStatus('listening');
    hintEl.textContent = 'Listening... keep talking, or tap the mic to send';
    // Clicks that slipped through die quickly; a mic tap waits for the first words
    resetSilenceTimer(bargeIn ? 1100 : PRE_SPEECH_TIMEOUT_MS);

  } catch(e) {
    console.error('Recording failed:', e);
    setStatus('idle');
  }
}

function stopRecording() {
  if (!isRecording || !mediaRecorder) return;
  clearTimeout(silenceTimer);
  mediaRecorder.stop();
}

async function sendAudio() {
  const elapsed = performance.now() - recordStartedAt;
  if (chunks.length === 0 || !heardSpeech || elapsed < 600) {
    resumePausedAgent();
    return;
  }

  const blob = new Blob(chunks, { type: 'audio/webm' });
  const buf = await blob.arrayBuffer();
  const bytes = new Uint8Array(buf);
  let binary = '';
  const chunkSize = 8192;
  for (let i = 0; i < bytes.length; i += chunkSize) {
    const chunk = bytes.subarray(i, i + chunkSize);
    binary += String.fromCharCode(...chunk);
  }
  const b64 = btoa(binary);

  if (pausedForBargeIn) {
    send({ type: 'interrupt' });
  }
  send({ type: 'audio', data: b64 });
  setStatus('transcribing');
  hintEl.textContent = 'Speak anytime to interrupt. Tap the mic when the agent is idle.';
}

function toggleMic() {
  if (agentSpeaking || (pausedForBargeIn && !isRecording)) {
    interruptTimestamp = performance.now();
    stopAgentNow({ hard: true });
  }
  if (isRecording) stopRecording();
  else startRecording();
}

// ── UI helpers ────────────────────────────────────────────────────────
function updateMicBtn() {
  if (isRecording) {
    micBtn.classList.add('recording');
    micBtn.classList.remove('disabled');
    micBtn.textContent = '⏹';
    micBtn.appendChild(volRing);
  } else {
    micBtn.classList.remove('recording');
    micBtn.textContent = '🎤';
    micBtn.appendChild(volRing);
  }
}

const STATUS_CONFIG = {
  idle:          { color: '#22c55e', label: 'Ready — speak or tap mic' },
  listening:     { color: '#22c55e', label: 'Listening...' },
  transcribing:  { color: '#f59e0b', label: 'Transcribing your speech...' },
  thinking:      { color: '#f59e0b', label: 'Thinking...' },
  speaking:      { color: '#6366f1', label: 'Speaking — interrupt anytime!' },
  disconnected:  { color: '#ef4444', label: 'Disconnected — reconnecting...' },
};

function setStatus(key) {
  const cfg = STATUS_CONFIG[key] || STATUS_CONFIG.idle;
  statusDot.style.background = cfg.color;
  statusDot.style.boxShadow = `0 0 6px ${cfg.color}`;
  statusLabel.textContent = cfg.label;
}

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div>
      <div class="bubble">${escHtml(text)}</div>
      <div class="msg-time">${now()}</div>
    </div>`;
  msgContainer.appendChild(div);
  msgContainer.scrollTop = msgContainer.scrollHeight;
}

let typingEl = null;
function showTyping() {
  if (typingEl) return;
  typingEl = document.createElement('div');
  typingEl.className = 'msg agent';
  typingEl.innerHTML = `<div class="bubble"><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
  msgContainer.appendChild(typingEl);
  msgContainer.scrollTop = msgContainer.scrollHeight;
}
function removeTyping() {
  if (typingEl) { typingEl.remove(); typingEl = null; }
}

function send(obj) {
  if (wsReady) ws.send(JSON.stringify(obj));
}

function now() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
// ── Always-on background listener ─────────────────────────────────
async function startBackgroundMonitor() {
  if (bgStartPromise) {
    await bgStartPromise;
    if (bgCtx && bgCtx.state === 'suspended') await bgCtx.resume().catch(() => {});
    return;
  }

  bgStartPromise = (async () => {
    bgStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
    bgCtx = new AudioContext();
    await bgCtx.resume();
    const source = bgCtx.createMediaStreamSource(bgStream);
    const bgAnalyser = bgCtx.createAnalyser();
    bgAnalyser.fftSize = 512;
    source.connect(bgAnalyser);
    const timeData = new Uint8Array(bgAnalyser.fftSize);

    function rmsVolume() {
      bgAnalyser.getByteTimeDomainData(timeData);
      let sum = 0;
      for (let i = 0; i < timeData.length; i++) {
        const v = (timeData[i] - 128) / 128;
        sum += v * v;
      }
      return Math.sqrt(sum / timeData.length) * 100;
    }

    function tick() {
      if (bgCtx && bgCtx.state === 'suspended') {
        requestAnimationFrame(tick);
        return;
      }

      const vol = rmsVolume();

      // Stop the agent as soon as speech starts; ignore sub-120ms clicks
      if (agentSpeaking && !isRecording && vol > INTERRUPT_RMS_THRESHOLD) {
        if (!bargeInStartedAt){
          bargeInStartedAt = performance.now();
          interruptTimestamp=performance.now();
        }
        volRing.classList.add('active');
        if (performance.now() - bargeInStartedAt >= CLICK_IGNORE_MS) {
          bargeInStartedAt = 0;
          stopAgentNow({ hard: false });
          startRecording({ bargeIn: true });
        }
      } else if (!isRecording) {
        bargeInStartedAt = 0;
        volRing.classList.remove('active');
      }

      if (isRecording && vol > SPEECH_RMS_THRESHOLD) {
        heardSpeech = true;
        resetSilenceTimer();
      }

      requestAnimationFrame(tick);
    }
    tick();
    console.log('Background monitor started.');
  })();

  try {
    await bgStartPromise;
  } catch (e) {
    bgStartPromise = null;
    console.error('Background monitor failed:', e);
  }
}

function unlockListening() {
  startBackgroundMonitor();
}
['pointerdown', 'keydown', 'touchstart'].forEach(ev => {
  window.addEventListener(ev, unlockListening, { capture: true });
});
startBackgroundMonitor();

// ── Init ─────────────────────────────────────────────────────────────
connect();
</script>
</body>
</html>
